name: Verify static export

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate generated files
        run: npm run build
      - name: Verify committed output is current
        run: test -z "$(git status --porcelain)"
